# Vet/build/test the private fireunix-app/shadow-control source.
#
# This repository is PUBLIC: the source is checked out at run time with a
# read-only deploy key. Logs may show the location of an error, but never
# whole files: each step's output is capped, gofmt reports only file names and
# nothing is uploaded as an artifact. The committed config/*.toml files are
# never read here (they hold real endpoints and credentials): config/ci.toml is
# generated at run time and points at throwaway MySQL/ClickHouse/Redis service
# containers with a random JWT secret, so every package's tests can run.
name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of fireunix-app/shadow-control"
        required: true
        default: main
      run_tests:
        description: "Run go test"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      RUNENV: ci
      GOFLAGS: -mod=readonly
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci
          MYSQL_DATABASE: shadow_ci
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pci"
          --health-interval 5s --health-timeout 5s --health-retries 30
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci
          CLICKHOUSE_DB: shadow_ci
        ports: ["9000:9000"]
        options: >-
          --health-cmd "clickhouse-client --user ci --password ci -q 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 30
    defaults:
      run:
        working-directory: shadow-control
        shell: bash
    steps:
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: fireunix-app/shadow-control
          ref: ${{ inputs.ref }}
          path: shadow-control
          ssh-key: ${{ secrets.CONTROL_DEPLOY_KEY }}
          persist-credentials: false

      - name: Set up Go (module + build cache)
        uses: actions/setup-go@v5
        with:
          go-version-file: shadow-control/go.mod
          cache-dependency-path: shadow-control/go.sum

      - name: Install log limiter
        working-directory: .
        run: |
          # Cap each step's output so a flood of errors cannot dump the source.
          sudo tee /usr/local/bin/cap >/dev/null <<'SH'
          #!/bin/sh
          exec awk -v max=1500 'NR<=max { print; next } { cut++ } END { if (cut) printf "... output truncated: %d more lines not shown\n", cut }'
          SH
          sudo chmod +x /usr/local/bin/cap

      - name: Prepare CI-only inputs
        run: |
          # Throwaway endpoints only; the JWT secret is random per run.
          cat > config/ci.toml <<EOF
          [DB]
          Type = "mysql"
          Username = "root"
          Password = "ci"
          Server = "127.0.0.1:3306"
          Database = "shadow_ci"

          [CK]
          Type = "clickhouse"
          Username = "ci"
          Password = "ci"
          Server = "127.0.0.1:9000"
          Database = "shadow_ci"

          [RedisConfig]
          Host = "127.0.0.1"
          Port = 6379
          Database = 0
          PoolSize = 10

          [AuthConfig]
          Secret = "$(openssl rand -hex 32)"
          ExpirationHours = 1
          RefreshExpirationHours = 24

          [LogConfig.Console]
          Enable = true
          Level = "warn"
          EOF
          # api/web embeds the built dashboard (gitignored); a placeholder lets
          # the package compile.
          mkdir -p api/web/dist/assets
          echo '<!doctype html><title>ci</title>' > api/web/dist/index.html
          echo '/* ci */' > api/web/dist/assets/ci.js

      - name: gofmt (file names only)
        run: |
          # AI-tooling scripts under .claude/.codex are not part of the build.
          files=$(gofmt -l $(git ls-files '*.go' ':!:.claude/**' ':!:.codex/**'))
          if [ -n "$files" ]; then
            echo "::error::gofmt would change these files:"
            echo "$files"
            exit 1
          fi

      - name: go vet
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          go vet ./... 2>&1 | cap

      - name: go build
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          go build ./... 2>&1 | cap

      - name: go test
        if: ${{ !cancelled() && inputs.run_tests }}
        run: |
          set -o pipefail
          go test -count=1 ./... 2>&1 | cap
